bio: |
  Dr. Owuor is a genomic epidemiologist and public health
  researcher with over 15 years of experience in infectious disease
  surveillance, pathogen genomics, molecular epidemiology, bioinformatics,
  and public health research.

  His work focuses on applying genomic technologies, bioinformatics,
  and data science to strengthen infectious disease surveillance,
  outbreak investigation, and public health preparedness.

  He has extensive experience in molecular surveillance, genomic
  epidemiology, laboratory systems strengthening, and collaborative
  research across Kenya and Africa. His interests lie at the intersection
  of science, technology, and public health, particularly translating
  pathogen genomic data into actionable public health intelligence.

