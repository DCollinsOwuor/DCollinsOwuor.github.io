bio: |
  David Collins Owuor, PhD, is a genomic epidemiologist, bioinformatician and global health researcher with over 15 years of experience in infectious disease surveillance, pathogen genomics, molecular epidemiology, public health laboratory systems, outbreak investigation and response, and international health programmes.

  His professional experience spans the Kenya Medical Research Institute (KEMRI), KEMRI-Wellcome Trust Research Programme, the US Centers for Disease Control and Prevention (CDC), and the World Health Organization (WHO). He has contributed to national, regional and international public health initiatives, including genomic surveillance, laboratory capacity strengthening, sequencing implementation, outbreak response, and the development of computational approaches for infectious disease analysis.

  His research focuses on translating pathogen genomic data into actionable public health intelligence. Key areas include poliovirus and vaccine-derived poliovirus surveillance, influenza virus evolution and transmission, measles whole-genome sequencing, SARS-CoV-2 genomic epidemiology, HIV research, wastewater-based surveillance, phylogenetics, phylodynamics, and bioinformatics.

  He is particularly interested in the application of artificial intelligence, data science and computational methods to strengthen pathogen surveillance, disease preparedness and public health decision-making, especially in Africa.

  David has contributed to peer review for international scientific journals, with 35 recorded peer-review activities across 10 journal groups in his ORCID record.

