  - role: "Virology and Bioinformatics Consultant"
    org: "Global Polio Eradication Initiative – WHO Regional Office for Africa"
    start: "2024-05-01"
    end: "2025-04-30"
    summary: |
      Supported poliovirus genomic epidemiology and regional surveillance through bioinformatics workflows, high-performance computing and cloud-based analyses using Python and R. Contributed to surveillance metrics, technical reports, scientific publications and regional bulletins. Supported sequencing expansion, quality assurance, laboratory systems strengthening, training and accreditation activities.

  - role: "Postdoctoral Scientist"
    org: "KEMRI-Wellcome Trust Research Programme"
    start: "2023-01-01"
    end: "2023-12-31"
    summary: |
      Contributed to HIV B-cell biology and vaccine research, including bioinformatics analysis of African population sequencing data, clinical trial data platforms, computational pipelines and consortium-based research. Supported research training and capacity development.

  - role: "Postdoctoral Scientist"
    org: "National Center for Immunization and Respiratory Diseases, Centers for Disease Control and Prevention (CDC)"
    start: "2021-03-01"
    end: "2022-09-30"
    summary: |
      Conducted next-generation sequencing and genomic epidemiology analyses of SARS-CoV-2 and influenza viruses. Applied phylogenetics, phylodynamics and computational methods using high-performance computing and cloud infrastructure. Contributed to reproducible Snakemake workflows, technical documentation, standard operating procedures, scientific publications and international training.

  - role: "Doctoral Fellow – Genomic Epidemiology"
    org: "KEMRI-Wellcome Trust Research Programme"
    start: "2016-10-01"
    end: "2020-10-31"
    summary: |
      Investigated the genomic diversity, evolution and transmission of influenza viruses in Kenya. Developed and applied whole-genome sequencing and bioinformatics workflows, phylogenetic and phylodynamic analyses, and contributed to scientific publications, presentations and training of research staff and students.

  - role: "Research Officer – Diagnostics and Laboratory Systems Programme"
    org: "CDC Kenya"
    start: "2013-01-01"
    end: "2016-09-30"
    summary: |
      Conducted molecular characterization and laboratory investigation of respiratory, enteric, viral haemorrhagic fever and acute febrile illness pathogens. Applied PCR, cell culture and multiplex diagnostic methods. Supported outbreak investigations and public health response in Kenya and East Africa, sequencing and bioinformatics activities, laboratory quality systems and technical training.

  - role: "Technical Consultant – West Africa Ebola Response"
    org: "Global Outbreak Alert and Response Network (GOARN) / World Health Organization"
    start: "2014-10-01"
    end: "2014-11-30"
    summary: |
      Contributed to the international public health response to the Ebola outbreak in Liberia through technical support within the WHO/GOARN response framework.

