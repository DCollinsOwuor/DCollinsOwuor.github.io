bio: |
  Dr. David Collins Owuor is a strategic global health leader, genomic
  epidemiologist and bioinformatician with over 15 years of experience in
  infectious disease surveillance, pathogen genomics, molecular epidemiology,
  public health laboratory systems, preparedness and response.

  He has worked with the Kenya Medical Research Institute (KEMRI),
  KEMRI-Wellcome Trust Research Programme, the United States Centers for
  Disease Control and Prevention (CDC), and the World Health Organization
  (WHO), contributing to research, surveillance and public health initiatives
  across national, regional and international settings.

  His professional expertise includes leading and supporting complex
  multi-stakeholder initiatives, genomic surveillance systems, laboratory
  strengthening, outbreak investigation, programme coordination, stakeholder
  engagement and strategic partnership development.

  Operating at the interface of science, policy and implementation, his work
  focuses on translating disease surveillance and pathogen genomic data into
  actionable public health intelligence. He is particularly interested in
  strengthening public health systems, advancing preparedness and response
  capabilities, and applying bioinformatics, data science and artificial
  intelligence to infectious disease surveillance.

  His research interests include poliovirus and vaccine-derived poliovirus
  surveillance, influenza and measles genomics, SARS-CoV-2, HIV genomics,
  wastewater-based pathogen surveillance, phylogenetics and phylodynamic
  modelling.

  He contributes to the scientific community through research collaboration,
  scientific peer review, mentorship and capacity strengthening. His public
  ORCID record documents 35 peer-review activities across 10 journal groups.

  Beyond his professional work, he has been involved in Rotary International
  since 2017, contributing to community service, club leadership, district
  committees, disease prevention, polio eradication advocacy and humanitarian
  initiatives.

