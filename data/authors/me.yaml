bio: |
  Genomic epidemiologist and bioinformatician with more than 15 years of experience
  contributing to infectious disease research, pathogen genomics, molecular
  surveillance, diagnostics and outbreak response. Work has included collaboration
  with public health and research institutions in Kenya and internationally,
  including KEMRI, the KEMRI-Wellcome Trust Research Programme, CDC and WHO.
  Interested in translating genomic and laboratory data into actionable public
  health intelligence and strengthening genomic surveillance capacity across Africa.

